name: Test Nipe on Ubuntu

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "Test Nipe on Ubuntu ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Run Ubuntu smoke test
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ubuntu:24.04 \
            sh -c '
              set -eu
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                bash \
                perl \
                cpanminus \
                gcc \
                make \
                iptables \
                tor \
                curl \
                ca-certificates \
                zlib1g-dev \
                libssl-dev \
                libio-socket-ssl-perl \
                libnet-ssleay-perl
              mkdir -p /tmp/nipe-ci-bin /var/run/tor /run/tor /var/log/tor
              touch /var/log/tor/log
              chown debian-tor:debian-tor /var/run/tor /run/tor /var/log/tor /var/log/tor/log
              printf "%s\n" "#!/bin/sh" "exit 0" > /tmp/nipe-ci-bin/systemctl
              chmod +x /tmp/nipe-ci-bin/systemctl
              export PATH=/tmp/nipe-ci-bin:$PATH
              cpanm --notest --installdeps .
              perl nipe.pl install
              status_output=$(perl nipe.pl status || true)
              printf "%s\n" "$status_output"
              printf "%s" "$status_output" | grep -F "[+] Status:"
              printf "%s" "$status_output" | grep -F "[+] Ip:"
            '
